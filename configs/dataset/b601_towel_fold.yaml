defaults:
  - lerobot_base
  - _self_

repo_id: ehalicki/b601_towel_fold
tolerance_s: 0.005  # reencode_dataset.py re-quantizes frame pts by ~1e-4 s

# square 256 at load so un-reencoded (native ~672x376) data matches the gop1_256
# re-encodes; lerobot's Diffusion also refuses mismatched shapes across cameras
image_size: [256, 256]

# torque only, never joint positions: pos in the state makes a served policy
# proprioception-captured (arms followed vision in only 14% of
# conflicts). An arm that wants the 14-d pos+torq vector overrides this in its run config.
# Must be one flat column, not a `.pos`/`.torq` group: a lerobot policy sizes its input
# layers from the dataset metadata and cannot see a group. Drops `.vel`, 21 dims in, 7 out
slices:
  observation.state: "*.torq"

normalize:
  keys: [action, observation.state]
  method: percentile
  percentiles: [1, 99]

augment:
  seed: null
  streams:
    "observation.images.*":
      random_crop:    {scale: [0.875, 1.0]}
      rotation:       {degrees: 7.5, p: 0.5}
      color_jitter:   {brightness: 0.2, contrast: 0.2, gamma: 0.2, hue: 0.02}
      gaussian_noise: {std: 0.005}
    "observation.state*": {gaussian_noise: {std: 0.005}}
