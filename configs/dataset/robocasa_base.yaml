# fetch a task's episodes first: python -m lewam.scripts.fetch_robocasa_task <TaskName>
defaults:
  - lerobot_base
  - _self_

repo_id: lerobot/robocasa_target_human_unified

normalize:
  keys: [action, observation.state]
  method: percentile
  percentiles: [1, 99]

augment:
  seed: null
  streams:
    "observation.images.*":
      random_crop:    {scale: [0.875, 1.0]}
      rotation:       {degrees: 7.5, p: 0.5}
      color_jitter:   {brightness: 0.2, contrast: 0.2, gamma: 0.2, hue: 0.02}
      gaussian_noise: {std: 0.005}
    "observation.state": {gaussian_noise: {std: 0.005}}
