# @package _global_
defaults:
  - override /dataset: b601_pnpt
  - override /algorithm: flow_wam_video_only_nosigreg_frozen_b601
  - override /eval: holdout

# the integrated endpoint -- the same quantity every arm reports, regardless of its streams
best_metric: loss/int_action
best_mode: min

experiment:
  eval_every: 200
  max_steps: 20000
  # frozen ViT-B: the checkpointing covers the trunk only
  gradient_checkpointing: true

subsample_streams:
  "observation.images.*": {every: 3}

cache_encodings:
  augmentation_draws: 4
  store_on: auto
  disk_path: /tmp/lewam_enc_cache

