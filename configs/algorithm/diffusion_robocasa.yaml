defaults:
  - lerobot_policy_common
  - dims_robocasa
  - _self_

policy:
  type: diffusion
  horizon: ${algorithm.diffusion_horizon}
  n_action_steps: ${algorithm.chunk_len}
  n_obs_steps: 2
  resize_shape: [256, 256]
  crop_ratio: 0.95
  optimizer_lr: 1.0e-4
  down_dims: [256, 512, 1024]

conditioning:
  observation.images.robot0_agentview_left:
    index: "-1..0"
    fps: ${algorithm.action_fps}
  observation.images.robot0_agentview_right:
    index: "-1..0"
    fps: ${algorithm.action_fps}
  observation.images.robot0_eye_in_hand:
    index: "-1..0"
    fps: ${algorithm.action_fps}
  observation.state:
    index: "-1..0"
    fps: ${algorithm.action_fps}

predict:
  action:
    index: ${algorithm.diffusion_action_index}
